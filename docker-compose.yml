version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: investment_db
    environment:
      POSTGRES_DB: investment_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: investment_backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/investment_platform?sslmode=disable
      JWT_SECRET: your-production-secret-change-this
      PORT: 8080
      ADMIN_EMAIL: admin@platform.com
      ADMIN_PASSWORD: admin123
      ADMIN_NAME: System Administrator
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: investment_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
